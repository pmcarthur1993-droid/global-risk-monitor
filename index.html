<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Risk Monitor</title>
<style>
:root{--ground:#eef1f5;--card:#fff;--navy:#0b2545;--navy2:#1d4e89;--ink:#1c2733;--mute:#66758a;--line:#dde3ea;

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px}
.top h1{margin:0 0 4px;font-size:22px;font-weight:600}
.top p{margin:2px 0;font-size:13px;opacity:.9}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(11,37,69,.12);margin-bottom:14px;overflow:hidden}
.card>h2{margin:0;padding:11px 16px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;gap:10px}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy);font-size:13px;font-weight:700;align-items:center;justify-content:center;flex:none}
.body{padding:14px 16px}
.note{font-size:12.5px;color:var(--mute);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.flag{border-radius:8px;padding:10px 12px;border-left:5px solid var(--n);background:var(--nb)}
.flag b{display:block;font-size:14px}
.flag span{font-size:12.5px;color:#3c4858}
.flag.g{border-color:var(--g);background:var(--gb)}.flag.a{border-color:var(--a);background:var(--ab)}.flag.r{border-color:var(--r);background:var(--rb)}
.lvl{float:right;font-size:11px;font-weight:700;letter-spacing:.4px;padding:1px 7px;border-radius:9px;color:#fff;background:var(--n)}
.g .lvl{background:var(--g)}.a .lvl{background:var(--a)}.r .lvl{background:var(--r)}
.grp{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}
.grp:first-child{margin-top:0}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .lab{font-size:13px;font-weight:600}
.tile .val{font-size:24px;font-weight:600;margin:2px 0 0}
.tile .val small{font-size:12px;font-weight:400;color:var(--mute)}
.tile .sub{font-size:12px;color:var(--mute)}
.tile svg{display:block;width:100%;height:46px;margin:6px 0 2px}
.up{color:var(--r)}.dn{color:var(--g)}.flat{color:var(--mute)}
a{color:var(--navy2)}
.src{font-size:11.5px}
ul.chg{margin:0;padding-left:18px}ul.chg li{margin:3px 0}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style-position:inside}
summary small{font-weight:400;color:var(--mute)}
.tl{padding:0 12px 10px}
.ev{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ev .d{color:var(--mute);font-size:12.5px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--nb);color:var(--n);border-radius:4px;padding:0 5px;margin-right:5px}
.tag.et{background:#e4ecf7;color:#1d4e89}
.ocl{margin:0 0 8px}.ocl>span{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.obs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}.ob{border-radius:8px;padding:8px 6px;text-align:center;font-size:11.5px;font-weight:600}.ob b{display:block;font-size:22px;line-height:1.1}
.oeg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.oe{border:1px solid var(--line);border-left:6px solid #9aa7b6;border-radius:8px;padding:10px 12px;background:#fff}
.oe-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.oe-name{font-weight:600;font-size:14px;line-height:1.3}
.oe-est{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#e4ecf7;color:#1d4e89;border-radius:4px;padding:1px 5px;vertical-align:middle}
.oe-p{font-size:22px;font-weight:700;line-height:1;text-align:right;white-space:nowrap}.oe-p span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.hzs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:9px 0 8px}.hzc{border-radius:5px;padding:3px 0 4px;text-align:center;font-size:12.5px;font-weight:700;border:2px solid transparent}.hzc i{display:block;font-style:normal;font-size:9.5px;font-weight:600;opacity:.8}.hzc.sel{border-color:var(--navy)}
.oe-def{font-size:12px;color:var(--mute);line-height:1.4}.oe-now{font-size:12px;color:#1d4e89;margin-top:5px;font-weight:600}.oe-st{font-size:12px;line-height:1.4;margin-top:6px;padding:6px 8px;border-radius:6px;background:#eef1f5;color:#39424e;border-left:3px solid #9aa5b1}.oe-st.on{background:#fdecea;color:#7a1c14;border-left-color:#b3261e}.oe-st.on.lv{background:#fff4e0;color:#7a4b00;border-left-color:#d98a00}.oe-alt{white-space:nowrap;opacity:.85}.oe-ey{color:var(--mute)}.paidb{flex:1 0 100%;display:flex;justify-content:space-between;align-items:center;border:1px dashed #9aa5b1;background:#fff;color:#39424e;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}.paidb b{color:#1f3a5f}.pubb{font-size:12px;color:#39424e;background:#fff;border:1px solid #c9d1db;border-radius:8px;padding:7px 10px;margin:0 0 8px}.tabs{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:4px;overflow-x:auto;padding:8px 0;margin:0 0 10px;background:var(--bg,#eef1f5);-webkit-overflow-scrolling:touch}.tabb{flex:1 1 auto;border:1px solid #c9d1db;background:#fff;color:#1f3a5f;border-radius:8px;padding:9px 6px;font:inherit;font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer}.tabb.on{background:linear-gradient(135deg,#1f3a5f,#16304f);color:#fff;border-color:#16304f}.apif label{display:block;font-size:12px;font-weight:600;color:#39424e;margin-top:10px}.apif input,.apif select{display:block;width:100%;box-sizing:border-box;padding:9px 10px;margin-top:4px;border:1px solid #c9d1db;border-radius:6px;font:inherit;font-weight:400;background:#fff}.apif button{margin-top:12px}
.oe details{margin-top:6px;font-size:12px;color:#3c4858}.oe summary{cursor:pointer;color:var(--navy2);font-weight:600}
.bL{background:#e3f3e9;color:#1f6b41}.bM{background:#fdf1d8;color:#8a5a0b}.bH{background:#fde3d3;color:#a8431a}.bV{background:#f6cfca;color:#8f1d1d}.bN{background:#eef1f5;color:#66758a}
.oe.bL,.oe.bM,.oe.bH,.oe.bV,.oe.bN{background:#fff;color:var(--ink)}.oe.bL{border-left-color:#2e8b57}.oe.bM{border-left-color:#d99a00}.oe.bH{border-left-color:#d9622b}.oe.bV{border-left-color:#b3261e}
.oe.bL .oe-p{color:#1f6b41}.oe.bM .oe-p{color:#8a5a0b}.oe.bH .oe-p{color:#a8431a}.oe.bV .oe-p{color:#8f1d1d}
@media(max-width:520px){.ob{font-size:10.5px}.ob b{font-size:19px}}
.gc{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:4px;padding:1px 5px;white-space:nowrap}
.gA{background:#e3f3e9;color:#1f6b41}.gB{background:#e4ecf7;color:#1d4e89}.gC{background:#fdf1d8;color:#8a5a0b}.gU{background:#eef1f5;color:#66758a}
.cfr{display:flex;align-items:center;gap:8px;margin:0 0 7px}.cf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px}
.cfH{background:#e3f3e9;color:#1f6b41}.cfM{background:#e4ecf7;color:#1d4e89}.cfL{background:#eef1f5;color:#66758a;border:1px dashed #9aa7b6}
.cfd i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d5dbe3;margin-right:3px}.cfd i.on{background:#1d4e89}
.cfl{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);line-height:1.5}.cfs{margin:8px 0 2px;font-size:12px;color:var(--mute)}
.oe-rg{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#1d4e89;margin-bottom:2px}
.pill small{font-weight:600;opacity:.65;font-size:10.5px}
.oe-rise{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;background:#f6cfca;color:#8f1d1d;border-radius:4px;padding:2px 7px}
.oe-warn{margin-top:6px;font-size:12px;line-height:1.4;background:#fdf1d8;color:#6b4708;border-left:4px solid #d99a00;border-radius:4px;padding:5px 8px}
.oe-nowarn{margin-top:5px;font-size:11.5px;color:var(--mute)}
.coin{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;width:100%;max-width:320px;margin:0 6px 6px 0;box-sizing:border-box}
.cofact{font-size:12.5px;line-height:1.45;background:#eef3fa;border-left:4px solid #1d4e89;border-radius:4px;padding:7px 10px;margin:0 0 10px;color:#22344d}.cofact.warnb{background:#fdf1d8;border-left-color:#d99a00;color:#6b4708}
.cog{border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:0 0 5px;background:#fff}.cog summary{cursor:pointer;font-weight:600;font-size:13px}.cog summary small{font-weight:400;color:var(--mute)}.cog .fing{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.fin{display:block;font-size:11.5px;color:var(--mute);font-weight:600}.fin span{display:block;margin-bottom:3px;line-height:1.25}.fin input,.fin textarea{font:inherit;font-size:14px;width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fffbe6}.fin.wide{margin-top:8px}
.cot td.cim{width:74px;text-align:right;font-weight:700;white-space:nowrap}.cot td.cim small{display:block;font-weight:400;font-size:10px;color:var(--mute)}.cna{color:#9aa7b6;font-weight:400}

.aS{background:#f6cfca;border-color:#8f1d1d;color:#6e1616}.aE{background:#fde3d3;border-color:#d9622b;color:#7a3413}.aW{background:#fdf1d8;border-color:#d99a00;color:#6b4708}.aN{background:#e3f3e9;border-color:#2e8b57;color:#174a2e}
.atw td:first-child{width:52px;font-size:10px;font-weight:700;text-align:center;text-transform:uppercase;border-radius:4px}.cot.atw td:nth-child(2){text-align:left;width:auto;font-weight:400;border-radius:0}.aon{background:#f6cfca;color:#8f1d1d}.aoff{background:#eef1f5;color:#66758a}
.apush{background:#1b2a41;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;margin:10px 0}.apush span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:4px}
.demo{background:#fff8d6;border:2px dashed #d99a00;border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px;font-weight:600;color:#6b4708}
.pill{margin-top:5px}
.verd{border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin:10px 0 4px;border-left:6px solid}.vg{background:#e3f3e9;border-color:#2e8b57;color:#174a2e}.vr{background:#fbe4e1;border-color:#b3261e;color:#6e1616}.vn{background:#eef1f5;border-color:#9aa7b6;color:#4a5668}
.cot{width:100%;border-collapse:collapse;font-size:12.5px}.cot td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.cot td:nth-child(2){width:48px;text-align:center;font-weight:700;border-radius:4px}.cot td:nth-child(3){width:64px;text-align:right}.cot .oe-rg{display:inline;margin-right:6px}
.cofl{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;background:#f6cfca;color:#8f1d1d;border-radius:4px;padding:1px 5px}.como{font-size:11.5px;color:var(--mute);padding:3px 6px}
.pill.px{padding:3px 7px;margin-left:-4px}.conly{background:#eef3fa;border-radius:6px;padding:7px 10px;margin:0 0 10px;font-size:12.5px}
.pill{border:1px solid var(--line);background:#fff;color:#1b2733;border-radius:14px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;margin:0 5px 6px 0}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.warn{background:var(--ab);border-left:5px solid var(--a);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{text-align:left;padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600}
@media(max-width:520px){.ev{grid-template-columns:1fr;gap:1px}.top h1{font-size:19px}}
</style>
</head>
